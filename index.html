<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year 2026 - Cyberpunk Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', 'Courier New', monospace;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Animated Background Grid */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Particle Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            animation: float linear infinite;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Glass Card */
        .countdown-card {
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 
                0 0 60px rgba(0, 255, 255, 0.3),
                inset 0 0 60px rgba(0, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .countdown-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(0, 255, 255, 0.05),
                transparent
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Year Indicator */
        .year-indicator {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00f5ff, #ff00ff, #00f5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s linear infinite;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        @keyframes gradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Countdown Timer */
        .timer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin: 40px 0;
            position: relative;
        }

        .time-unit {
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .time-unit:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.4);
        }

        .time-value {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #00f5ff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            display: block;
            line-height: 1;
        }

        .time-label {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            display: block;
        }

        /* Milliseconds Display */
        .milliseconds {
            text-align: center;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: #ff00ff;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
            margin-top: 20px;
            font-weight: 600;
        }

        /* Celebration Message */
        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .celebration.active {
            opacity: 1;
        }

        .celebration-text {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 900;
            background: linear-gradient(45deg, #00f5ff, #ff00ff, #ffff00, #00ff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: celebrateGradient 2s ease infinite;
            text-align: center;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            letter-spacing: 5px;
        }

        @keyframes celebrateGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Canvas for particles and fireworks */
        #celebrationCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: none;
        }

        #celebrationCanvas.active {
            display: block;
        }

        /* Music Toggle */
        .music-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .music-toggle:hover {
            background: rgba(0, 255, 255, 0.4);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        }

        .music-icon {
            font-size: 24px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .countdown-card {
                padding: 40px 20px;
            }

            .timer {
                gap: 15px;
            }

            .time-unit {
                padding: 15px 10px;
            }

            .music-toggle {
                width: 50px;
                height: 50px;
                bottom: 20px;
                right: 20px;
            }
        }

        /* Glitch Effect on Hover */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch:hover {
            animation: glitch 0.3s infinite;
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="cyber-grid"></div>
    <div class="particles" id="particlesContainer"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="countdown-card">
            <div class="year-indicator glitch" id="yearIndicator">
                YEAR 2026 INCOMING...
            </div>

            <div class="timer" id="timer">
                <div class="time-unit">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">Seconds</span>
                </div>
            </div>

            <div class="milliseconds" id="milliseconds">
                .000
            </div>
        </div>
    </div>

    <!-- Celebration Elements -->
    <canvas id="celebrationCanvas"></canvas>
    <div class="celebration" id="celebration">
        <div class="celebration-text">HAPPY NEW YEAR 2026 🎉</div>
    </div>

    <!-- Music Toggle -->
    <div class="music-toggle" id="musicToggle" title="Toggle Music">
        <span class="music-icon">🔇</span>
    </div>

    <script>
        // ==================== COUNTDOWN TIMER ====================
        
        let countdownInterval;
        let celebrationTriggered = false;
        let audioContext;
        let musicPlaying = false;

        // Get user's local timezone and calculate next New Year
        function getNextNewYear() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const nextYear = currentYear + 1;
            // Set to January 1st of next year at midnight in user's local timezone
            return new Date(nextYear, 0, 1, 0, 0, 0, 0);
        }

        // Format number with leading zero
        function pad(num) {
            return String(num).padStart(2, '0');
        }

        // Update countdown display
        function updateCountdown() {
            const now = new Date();
            const newYear = getNextNewYear();
            const diff = newYear - now;

            // If New Year has passed, trigger celebration
            if (diff <= 0 && !celebrationTriggered) {
                celebrationTriggered = true;
                triggerCelebration();
                return;
            }

            // Calculate time units
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const milliseconds = Math.floor(diff % 1000);

            // Update DOM
            document.getElementById('days').textContent = pad(days);
            document.getElementById('hours').textContent = pad(hours);
            document.getElementById('minutes').textContent = pad(minutes);
            document.getElementById('seconds').textContent = pad(seconds);
            document.getElementById('milliseconds').textContent = '.' + String(milliseconds).padStart(3, '0');
        }

        // ==================== PARTICLE BACKGROUND ====================
        
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            const particleCount = window.innerWidth < 768 ? 30 : 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }

        // ==================== CELEBRATION ANIMATION ====================
        
        function triggerCelebration() {
            clearInterval(countdownInterval);
            
            const canvas = document.getElementById('celebrationCanvas');
            const celebration = document.getElementById('celebration');
            const yearIndicator = document.getElementById('yearIndicator');
            
            canvas.classList.add('active');
            celebration.classList.add('active');
            yearIndicator.textContent = 'HAPPY NEW YEAR!';
            
            // Initialize canvas
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            
            // Particle system for celebration
            const particles = [];
            const particleCount = 300;
            const colors = ['#00f5ff', '#ff00ff', '#ffff00', '#00ff00', '#ff0080'];
            
            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 15;
                    this.vy = (Math.random() - 0.5) * 15 - 5;
                    this.radius = Math.random() * 4 + 2;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.life = 1;
                    this.decay = Math.random() * 0.01 + 0.005;
                }
                
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.3; // gravity
                    this.life -= this.decay;
                }
                
                draw() {
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Firework class
            class Firework {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.targetY = Math.random() * canvas.height * 0.5;
                    this.speed = Math.random() * 3 + 5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.exploded = false;
                }
                
                update() {
                    if (!this.exploded) {
                        this.y -= this.speed;
                        if (this.y <= this.targetY) {
                            this.explode();
                        }
                    }
                }
                
                explode() {
                    this.exploded = true;
                    for (let i = 0; i < 50; i++) {
                        particles.push(new Particle(this.x, this.y));
                    }
                }
                
                draw() {
                    if (!this.exploded) {
                        ctx.fillStyle = this.color;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            
            const fireworks = [];
            let frameCount = 0;
            
            // Initial burst
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(canvas.width / 2, canvas.height / 2));
            }
            
            // Animation loop
            function animate() {
                ctx.fillStyle = 'rgba(10, 10, 15, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Add new fireworks
                if (frameCount % 20 === 0 && fireworks.length < 5) {
                    fireworks.push(new Firework());
                }
                
                // Update and draw fireworks
                for (let i = fireworks.length - 1; i >= 0; i--) {
                    fireworks[i].update();
                    fireworks[i].draw();
                    if (fireworks[i].exploded) {
                        fireworks.splice(i, 1);
                    }
                }
                
                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                
                frameCount++;
                
                // Continue animation for 15 seconds
                if (frameCount < 900) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
            
            // Play celebration sound effect (beep)
            if (audioContext) {
                playCelebrationSound();
            }
        }

        // ==================== AUDIO ====================
        
        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playCelebrationSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Music toggle functionality
        document.getElementById('musicToggle').addEventListener('click', function() {
            if (!audioContext) {
                initAudio();
            }
            
            const icon = this.querySelector('.music-icon');
            if (musicPlaying) {
                icon.textContent = '🔇';
                musicPlaying = false;
            } else {
                icon.textContent = '🔊';
                musicPlaying = true;
                // Simple ambient tone
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 200;
                oscillator.type = 'sine';
                gainNode.gain.value = 0.05;
                oscillator.start();
                
                setTimeout(() => {
                    oscillator.stop();
                    icon.textContent = '🔇';
                    musicPlaying = false;
                }, 5000);
            }
        });

        // ==================== INITIALIZATION ====================
        
        window.addEventListener('load', () => {
            createParticles();
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 50); // Update every 50ms for smooth milliseconds
        });

        // Handle window resize for canvas
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('celebrationCanvas');
            if (canvas.classList.contains('active')) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
